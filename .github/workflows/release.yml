name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: target/release/grab.exe
            name: grab-windows-x64.exe
          - os: ubuntu-latest
            file: target/release/grab
            name: grab-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VER\"/" Cargo.toml
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release
      - name: Rename
        shell: bash
        run: cp "${{ matrix.file }}" "${{ matrix.name }}"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Не вдалося прочитати version з Cargo.toml" }
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }

          # Chocolatey може встановити ISCC.exe у різні стандартні каталоги.
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ChocolateyInstall 'lib\innosetup\tools\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }

          $iscc = $candidates | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) {
            throw "ISCC.exe не знайдено. Перевірте встановлення Inno Setup 6."
          }

          Write-Host "Building Grab installer v$version using $iscc"
          & $iscc "/DAppVersion=$version" "installer/Grab.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершився з кодом $LASTEXITCODE" }
          if (-not (Test-Path 'dist/Grab-Setup-x64.exe')) {
            throw "Інсталятор не створено: dist/Grab-Setup-x64.exe не знайдено"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Grab-Setup-x64.exe
          path: dist/Grab-Setup-x64.exe
      - name: Release binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
      - name: Release Windows installer
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Grab-Setup-x64.exe
