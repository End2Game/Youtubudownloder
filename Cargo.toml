[package]
name = "grab"
version = "1.1.3"
edition = "2021"
description = "Простий завантажувач відео та музики (GUI на egui, обгортка над yt-dlp + ffmpeg)"
license = "MIT"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
ureq = "2"
arboard = "3"
serde_json = "1"
notify-rust = "4"

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
winres = "0.1"
